<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moj dashboard — E-AI zdravo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">

<body>
<div class="app app-wide">
  <div class="top">
    <a class="brand" href="/"><img src="/assets/icon-96.png" alt="" width="32" height="32">E-AI zdravo</a>

  <div class="row">
    <button type="button" class="btn btn-line" data-act="cancel">Odustani</button>
    <button type="button" class="btn" style="background:var(--c-error)" data-act="confirm">Obriši</button>
  </div>
</dialog>
